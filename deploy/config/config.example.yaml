# /etc/shipard-mail-router/config.yaml
#
# Copy this file to /etc/shipard-mail-router/config.yaml and adjust.

policy_socket: /run/shipard-mail-router/policy.sock
lmtp_socket:   /run/shipard-mail-router/lmtp.sock

queue_db:      /var/lib/shipard-mail-router/queue.db

worker:
  poll_interval: 5
  batch_size:    10
  max_attempts:  4
  http_timeout:  30
  # Seconds to wait before the Nth attempt (index 0 = first retry delay).
  # Total attempts = max_attempts; after that the item moves to dead_letter.
  backoff: [0, 60, 300, 1800]

lookup_file:   /etc/shipard-mail-router/lookup.json
lookup_reload: true

# Optional: pull lookup.json from the Shipard hosting instead of editing
# it by hand. Runs as the shipard-mail-router-lookup-sync oneshot
# (systemd timer, every 2 minutes). The api_key comes from
# `shpd-ds hosting-router-key --generate` on the hosting data source.
# When the section is missing, lookup-sync refuses to run and the
# lookup file stays hand-managed.
#lookup_sync:
#  url:     https://portal.example.com/api/v1/_hosting/mail/lookup
#  api_key: shpd_hk_XXXX
#  timeout: 10

alerts:
  enabled:      true
  smtp_host:    localhost
  smtp_port:    25
  from_address: mail-router@shipard.email
  to_addresses:
    - admin@example.com
  throttle: 1800
  queue_size_threshold: 100

log_level: INFO
