[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipard-mail-router"
version = "0.1.0"
description = "Mail router daemon for Shipard — receives SMTP via Postfix, forwards to shpd HTTP API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shipard" }]
dependencies = [
    "aiosmtpd>=1.4.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
shipard-mail-router-policy = "mail_router.cli:run_policy"
shipard-mail-router-receiver = "mail_router.cli:run_receiver"
shipard-mail-router-worker = "mail_router.cli:run_worker"
shipard-mail-router-admin = "mail_router.cli:run_admin"
shipard-mail-router-lookup-sync = "mail_router.cli:run_lookup_sync"

[tool.setuptools.packages.find]
include = ["mail_router*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
